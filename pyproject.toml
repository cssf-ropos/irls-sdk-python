[project]
name = "irls-sdk"
version = "0.1.0"
description = "Python SDK for CSSF IRLS 3.0"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Canadian Scientific Submersible Facility (CSSF)" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14",
    "httpx>=0.28",
]
keywords = ["irls", "logging", "sensor", "navigation", "positioning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/cssf-ropos/irls-sdk-python"
Repository = "https://github.com/cssf-ropos/irls-sdk-python"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-httpx>=0.36.0",
    "ruff>=0.17.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/irls"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs a running IRLS 3.0 (set IRLS_URL)"]
